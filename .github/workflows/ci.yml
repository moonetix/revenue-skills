name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Skills follow the specification and the shared scripts are in sync
        run: npm run validate
      - name: Exploits work on the vulnerable app and fail on the fixed one
        run: npm test
      - name: The demo page builds from a fresh run of every attack
        run: npm run site
      - name: Both example audits still validate, and the referral-engine proofs fail before the fix and pass after it
        run: npm run check:example

  trials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Every trial checker passes its reference solution and catches its naive one as documented
        run: npm run trials:validate

  plugin-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          mode: scan
          min_score: 75
          fail_on_severity: none
          format: sarif
          upload_sarif: true

  scripts-on-node-20:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: The bundled scripts run on Node 20
        run: |
          node skills/money-audit/scripts/validate-findings.mjs test/fixtures/sample-findings.json --root playground/vulnerable
          node skills/money-audit/scripts/render-report.mjs test/fixtures/sample-findings.json --root playground/vulnerable > /dev/null
          node skills/money-audit/scripts/probe.mjs send '{"url":"http://127.0.0.1:9/"}'
          node playground/score.mjs test/fixtures/sample-findings.json
          node skills/design-reward-economy/scripts/economy-check.mjs skills/design-reward-economy/assets/economy.example.json > /dev/null
